# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Un formulaire HTML ne connaît que GET et POST. Avec cette option, Symfony lit
    # le champ caché « _method » (PUT, DELETE…) d'un formulaire POST (séance 4).
    http_method_override: true

    # Codespaces (et la plupart des hébergeurs) placent un proxy HTTPS devant Apache.
    # On fait confiance à ses en-têtes X-Forwarded-* : les URL générées par path()
    # et url() restent en https:// et les redirections ne repartent pas en http://.
    trusted_proxies: 'REMOTE_ADDR'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
