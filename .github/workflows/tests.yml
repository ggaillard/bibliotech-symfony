name: "Tests BiblioTech"

# Une tâche par séance : l'onglet Actions montre une ligne verte ou rouge pour chacune.
on:
  push:
    paths: ["projetSymfony/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["projetSymfony/**"]
  workflow_dispatch:

jobs:
  tests:
    name: "🧪 ${{ matrix.groupe }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        groupe: [socle, seance-01, seance-02, seance-03, seance-04, seance-05, seance-06, seance-07, seance-08]
    defaults:
      run:
        working-directory: projetSymfony

    # Même moteur que dans le Codespace : MySQL 8.4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      # Les tests créent eux-mêmes la base bibliotech_test et y jouent vos migrations
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/bibliotech?serverVersion=8.4.0&charset=utf8mb4"

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, intl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('projetSymfony/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: "php bin/phpunit --group=${{ matrix.groupe }}"
        run: php bin/phpunit --group=${{ matrix.groupe }}

  style:
    name: "🎨 Style du code (PHP CS Fixer)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetSymfony
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/php-cs-fixer check --diff
